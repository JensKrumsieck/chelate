name: 🦀 Continuous Integration
on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: stable
      - name: 📎 Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: 🏗️ Build
        run: cargo build

      - name: Run tests
        run: cargo test --verbose --workspace --all-features

  fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [cif, mol, mol2, pdb, xyz, bonds]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v2
        with:
          toolchain: nightly
          # new nightly warnings should not fail the fuzz run
          rustflags: ""
          cache-workspaces: fuzz
          cache-key: ${{ matrix.target }}
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      # keep the generated inputs between runs, so each run continues where the last one stopped
      - name: Restore corpus
        uses: actions/cache@v6
        with:
          path: fuzz/corpus/${{ matrix.target }}
          key: fuzz-corpus-${{ matrix.target }}-${{ github.run_id }}
          restore-keys: fuzz-corpus-${{ matrix.target }}-

      - name: 🐛 Fuzz ${{ matrix.target }}
        run: |
          mkdir -p fuzz/corpus/${{ matrix.target }}
          cargo +nightly fuzz run ${{ matrix.target }} fuzz/corpus/${{ matrix.target }} fuzz/seed/${{ matrix.target }} -- -dict=fuzz/dict/${{ matrix.target }}.dict -max_total_time=60 -timeout=10

      - name: Upload crash
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-crash-${{ matrix.target }}
          path: fuzz/artifacts/${{ matrix.target }}
